[package]
name = "stokerjack-rmk"
version = "0.2.0"
authors = ["Haobo Gu <haobogu@outlook.com>"]
description = "Stokerjack OST60 RMK firmware candidate"
homepage = "https://github.com/rmk-rs/rmk"
repository = "https://github.com/te9no/zmk-keyboard-stokerjack"
readme = "README.md"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
rmk = { git = "https://github.com/rmk-rs/rmk", rev = "986017d901c7609a9a79167686524f014effa68a", default-features = false, features = ["defmt", "storage", "vial", "host_lock", "watchdog", "async_matrix", "nrf52840_ble", "adafruit_bl"] }
nrf-sdc = { version = "0.4.0", features = [
    "defmt",
    "peripheral",
    "central",
    "nrf52840",
] }
nrf-mpsl = { version = "0.4.0", features = [
    "defmt",
    "critical-section-impl",
    "nrf52840",
] }
bt-hci = { version = "0.10", features = ["defmt"] }

cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
embassy-time = { version = "0.5", features = ["tick-hz-32_768", "defmt"] }
embassy-nrf = { version = "0.11", features = [
    "defmt",
    "nrf52840",
    "time-driver-rtc1",
    "gpiote",
    "unstable-pac",
    "nfc-pins-as-gpio",
    "time",
] }
embassy-executor = { version = "0.10", features = [
    "defmt",
    "platform-cortex-m",
    "executor-thread",
] }
defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }
static_cell = "2"
embassy-futures = "0.1"
embassy-sync = "0.8"
critical-section = "1.2"

async-trait = "0.1.88"


[build-dependencies]
xz2 = "0.1.7"
json = "0.12"
const-gen = "1.6"

[[bin]]
name = "stokerjack-rmk"
test = false
bench = false

[profile.dev]
codegen-units = 1      # better optimizations
debug = true
opt-level = 1
overflow-checks = true
lto = false
panic = 'unwind'

[profile.release]
codegen-units = 1       # better optimizations
debug = true            # no overhead for bare-metal
opt-level = "z"         # optimize for binary size
overflow-checks = false
lto = "fat"
